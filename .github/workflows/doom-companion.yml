name: UZDoom Engine Companion

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Checkout maintained UZDoom Android engine
        uses: actions/checkout@v4
        with:
          repository: manuelsiuro/GZDoom-Android-2026
          ref: main
          path: companion-source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Remove author-local Java path
        working-directory: companion-source
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Build UZDoom companion APK
        working-directory: companion-source
        run: ./gradlew :doom:assembleDebug --no-daemon

      - name: Upload UZDoom companion APK
        uses: actions/upload-artifact@v4
        with:
          name: mikael-uzdoom-engine-companion
          path: companion-source/doom/build/outputs/apk/debug/*.apk
          if-no-files-found: error
